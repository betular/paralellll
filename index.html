
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>Paralel Levhalar - Elektrik Alanı</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden; background:black;">

<a-scene
  embedded
  renderer="antialias: true; colorManagement: true"
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best">

  <a-marker preset="hiro">

    <!-- POZİTİF LEVHA -->
    <a-box position="-1.45 0 0"
      width="0.12" height="2.6" depth="3.2"
      color="#d62828"
      material="metalness:0.75; roughness:0.25">
    </a-box>

    <a-box position="-1.375 0 0"
      width="0.025" height="2.5" depth="3.1"
      color="#ff5252">
    </a-box>

    <!-- NEGATİF LEVHA -->
    <a-box position="1.45 0 0"
      width="0.12" height="2.6" depth="3.2"
      color="#1565c0"
      material="metalness:0.75; roughness:0.25">
    </a-box>

    <a-box position="1.375 0 0"
      width="0.025" height="2.5" depth="3.1"
      color="#42a5f5">
    </a-box>

    <!-- LEVHA ÇERÇEVELERİ -->
    <a-box position="-1.45 1.30 0"
      width="0.16" height="0.08" depth="3.25"
      color="#ff6b6b"></a-box>

    <a-box position="-1.45 -1.30 0"
      width="0.16" height="0.08" depth="3.25"
      color="#ff6b6b"></a-box>

    <a-box position="1.45 1.30 0"
      width="0.16" height="0.08" depth="3.25"
      color="#64b5f6"></a-box>

    <a-box position="1.45 -1.30 0"
      width="0.16" height="0.08" depth="3.25"
      color="#64b5f6"></a-box>


    <!-- POZİTİF YAZISI: KIRMIZI LEVHANIN ÖN YÜZÜ -->
    <a-entity position="-1.36 0 1.635">
      <a-text
        value="POZİTİF (+)"
        color="white"
        align="center"
        width="3.5"
        position="0 0 0.015">
      </a-text>
    </a-entity>


    <!-- NEGATİF YAZISI: MAVİ LEVHANIN ÖN YÜZÜ -->
    <a-entity position="1.36 0 1.635">
      <a-text
        value="NEGATİF (-)"
        color="white"
        align="center"
        width="3.5"
        position="0 0 0.015">
      </a-text>
    </a-entity>


    <a-entity id="electricField"></a-entity>

    <a-text value="ELEKTRİK ALANI"
      color="#00ffff"
      align="center"
      width="2.5"
      position="0 1.65 0">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>


<script>

const field = document.querySelector("#electricField");

const THREE = AFRAME.THREE;

const leftPlate = -1.36;
const rightPlate = 1.36;


// =================================================
// ÇİZGİ VE OK OLUŞTURMA
// =================================================

function drawLine(points, arrowIndex = 0) {

  const geometry =
    new THREE.BufferGeometry().setFromPoints(points);

  const material =
    new THREE.LineBasicMaterial({
      color: "white",
      transparent: true,
      opacity: 0.9
    });

  const line = new THREE.Line(geometry, material);

  field.object3D.add(line);

  if (arrowIndex > 0 && arrowIndex < points.length) {

    const p1 = points[arrowIndex - 1];
    const p2 = points[arrowIndex];

    const direction = new THREE.Vector3()
      .subVectors(p2, p1)
      .normalize();

    const arrow = document.createElement("a-cone");

    arrow.setAttribute("radius-bottom", "0.035");
    arrow.setAttribute("radius-top", "0");
    arrow.setAttribute("height", "0.12");
    arrow.setAttribute("color", "yellow");

    arrow.setAttribute(
      "position",
      `${p2.x} ${p2.y} ${p2.z}`
    );

    const quaternion = new THREE.Quaternion();

    quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction
    );

    arrow.object3D.quaternion.copy(quaternion);

    field.appendChild(arrow);
  }
}


// =================================================
// 1. LEVHALAR ARASINDA DÜZ ALAN ÇİZGİLERİ
// =================================================

const verticalPositions = [-0.9, -0.45, 0, 0.45, 0.9];
const depthPositions = [-1, -0.5, 0, 0.5, 1];

for (const y of verticalPositions) {

  for (const z of depthPositions) {

    const points = [];

    for (let i = 0; i <= 30; i++) {

      const t = i / 30;

      points.push(
        new THREE.Vector3(
          leftPlate + (rightPlate - leftPlate) * t,
          y,
          z
        )
      );
    }

    drawLine(points, 17);
  }
}


// =================================================
// 2. ÜST VE ALT KENARLARDA SAÇAKLANMA ÇİZGİLERİ
// =================================================

function createFringeLine(z, side) {

  const points = [];

  const segments = 50;

  for (let i = 0; i <= segments; i++) {

    const t = i / segments;

    const x =
      leftPlate + (rightPlate - leftPlate) * t;

    const curve = 0.42 * Math.sin(Math.PI * t);

    const y = side * (1.12 + curve);

    points.push(
      new THREE.Vector3(x, y, z)
    );
  }

  drawLine(points, 27);
}

for (const z of [-0.75, 0.75]) {

  createFringeLine(z, 1);
  createFringeLine(z, -1);
}


// =================================================
// 3. DERİNLİK YÖNÜNDE KENAR SAÇAKLANMASI
// =================================================

function createDepthFringe(y, side) {

  const points = [];

  const segments = 50;

  for (let i = 0; i <= segments; i++) {

    const t = i / segments;

    const x =
      leftPlate + (rightPlate - leftPlate) * t;

    const curve = 0.38 * Math.sin(Math.PI * t);

    const z = side * (1.15 + curve);

    points.push(
      new THREE.Vector3(x, y, z)
    );
  }

  drawLine(points, 27);
}

for (const y of [-0.5, 0.5]) {

  createDepthFringe(y, 1);
  createDepthFringe(y, -1);
}


// =================================================
// 4. MERKEZDE E VEKTÖRÜ
// =================================================

const centerArrow = document.createElement("a-cone");

centerArrow.setAttribute("radius-bottom", "0.055");
centerArrow.setAttribute("radius-top", "0");
centerArrow.setAttribute("height", "0.2");
centerArrow.setAttribute("color", "#00ff00");
centerArrow.setAttribute("position", "0 0 0");

centerArrow.object3D.rotation.z = -Math.PI / 2;

field.appendChild(centerArrow);


// E YAZISI

const eText = document.createElement("a-text");

eText.setAttribute("value", "E");
eText.setAttribute("color", "#00ff00");
eText.setAttribute("width", "0.8");
eText.setAttribute("align", "center");
eText.setAttribute("position", "0 0.22 0");

field.appendChild(eText);

</script>

</body>
</html>
